# Force D32 float depth buffer instead of D24 unorm.
# Required for VR hand layer depth remapping which produces
# negative depth values in the close-inspection zone.
d3d9.useD32forD24 = True

# Never vsync the desktop mirror window. The VR submit path shares the DXVK
# submit thread with the mirror present; a FIFO (vsynced) mirror at 60Hz
# throttles the entire HMD pipeline to the monitor's refresh rate.
d3d9.presentInterval = 0
