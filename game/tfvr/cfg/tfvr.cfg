// General
fps_max 240
mat_vsync 0
engine_no_focus_sleep 0
hud_quickinfo 0
hud_draw_fixed_reticle 0
hud_fastswitch 1
crosshair 1
joystick 1
// Set to 0 to stop crashing from hunk overflow error.
r_hunkalloclightmaps 0
// enable ragdolls for dead enemies
cl_ragdoll_collide 1
sv_autoladderdismount 1
// disable smoothing, interferes with VR
cl_smooth 1

// mat_queue_mode has no advantages for us; dxvk already queues rendering commands
mat_queue_mode 0

//Preloading and caching
cl_forcepreload 1
sv_forcepreload 1
mod_forcedata 1
mod_forcetouchdata 1

//Sound
snd_mix_async 1
snd_noextraupdate 1
snd_mute_losefocus 0
snd_surround_speakers 0
dsp_off 0
dsp_enhance_stereo 1
dsp_slow_cpu 0
snd_mixahead 0.1
snd_async_fullyasync 1

// texture quality
mat_forcemanagedtextureintohardware 1
mat_forceaniso 16

// Always use HDR
mat_hdr_level 2
// The default is 1 but 0.5 is more realistic.
mat_bloomscale 0.5

// settings to make water reflections acceptable performance-wise in VR
r_waterforceexpensive 0
r_waterforcereflectentities 0

tfvr_tracer_velocity_compensation ".001"
tfvr_laser_width ".1"
tfvr_hud_scale ".5"
tfvr_hands_alpha "1"
tfvr_weapon_fire_anim_pos_scale "1"
tfvr_weapon_fire_anim_pitch_scale "1"
tfvr_weapon_fire_anim_yaw_scale "1"
tfvr_weapon_fire_anim_roll_scale "1"
tfvr_hand_tracking_cube_size ".5"
tfvr_debug_pose_size ".4"
tfvr_pose_offset_y "0"
tfvr_aim_pose_y_correction "1.500000"
