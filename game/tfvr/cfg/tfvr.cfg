// General
fps_max 240
mat_vsync 0
engine_no_focus_sleep 0
hud_quickinfo 0
hud_draw_fixed_reticle 0
hud_fastswitch 1
crosshair 1
joystick 1
// Set to 0 to stop crashing from hunk overflow error.
r_hunkalloclightmaps 0
// enable ragdolls for dead enemies
cl_ragdoll_collide 1
sv_autoladderdismount 1
// disable smoothing, interferes with VR
cl_smooth 1

// mat_queue_mode has no advantages for us; dxvk already queues rendering commands
mat_queue_mode 0

//Preloading and caching
cl_forcepreload 1
sv_forcepreload 1
mod_forcedata 1
mod_forcetouchdata 1

//Sound
snd_mix_async 1
snd_noextraupdate 1
snd_mute_losefocus 0
snd_surround_speakers 0
dsp_off 0
dsp_enhance_stereo 1
dsp_slow_cpu 0
snd_mixahead 0.1
snd_async_fullyasync 1

// texture quality
mat_forcemanagedtextureintohardware 1
mat_forceaniso 16

// Always use HDR
mat_hdr_level 2

// The default is 1 but 0.5 is more realistic.
mat_bloomscale 0.5

mat_picmip "-1"

// settings to make water reflections acceptable performance-wise in VR
r_waterforceexpensive 0
r_waterforcereflectentities 0

mat_motion_blur_enabled "0"
r_shadowrendertotexture "1"

vr_moveaim_mode "1"
vr_zoom_multiplier "1"

// Player model in health hud crashes in VR
cl_hud_playerclass_use_playermodel "0"

// Disable Beginner Tutorials and Hints
cl_ask_blacklist_opt_out "1"
cl_ask_favorite_opt_out "1"
sb_dontshow_maxplayer_warning "1"
tf_explanations_backpackpanel "1"
tf_explanations_charinfo_armory_panel "1"
tf_explanations_charinfopanel "1"
tf_explanations_craftingpanel "1"
tf_explanations_discardpanel "1"
tf_explanations_store "1"
tf_training_has_prompted_for_forums "1"
tf_training_has_prompted_for_loadout "1"
tf_training_has_prompted_for_offline_practice "1"
tf_training_has_prompted_for_options "1"
tf_training_has_prompted_for_training "1"
